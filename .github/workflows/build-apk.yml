name: Build KYRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KYRO
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/android@8.0.0
          npx cap add android

      - name: Install Pillow for launcher icon processing
        run: |
          python3 -m pip install --user pillow

      - name: Install KYRO launcher icon
        run: |
          test -f resources/icon.png

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path("resources/icon.png")
          out_dir = Path("android/app/src/main/res/drawable")
          out_dir.mkdir(parents=True, exist_ok=True)

          # Use the supplied transparent KYRO icon as the native Android launcher icon.
          img = Image.open(src).convert("RGBA")
          img.save(out_dir / "kyro_icon.png", optimize=True)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          # Point both launcher icon fields to the KYRO icon.
          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@drawable/kyro_icon"',
              text,
              count=1
          )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@drawable/kyro_icon"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:roundIcon="@drawable/kyro_icon"',
                  1
              )

          manifest.write_text(text, encoding="utf-8")
          PY

          echo "KYRO launcher icon installed:"
          ls -lh android/app/src/main/res/drawable/kyro_icon.png

      - name: Add Android runtime permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')

          perms = [
            '<uses-permission android:name="android.permission.CAMERA" />',
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
            '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
          ]

          additions = '\n'.join(perms)

          if 'android.permission.CAMERA' not in s:
              pos = s.find('>', s.find('<manifest'))
              s = s[:pos+1] + '\n' + additions + '\n' + s[pos+1:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Sync KYRO
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload KYRO APK
        uses: actions/upload-artifact@v4
        with:
          name: KYRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
